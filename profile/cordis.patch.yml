- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
- id: ui-skin-claude-style
  name: dsh-claude-style
  config:
    brand: deepseek
    brandInk: text
    paletteColors: claude
    motion: full
    composerScope: all
    modelPicker: true
    peakrate: true
    quickProviders: []
    pageZoom: "1.1"
    sodium: on
    banLocale: off
    homeLayout: classic
    homeRipple: true
    palette: claude
    typeface: claude
    conversationWidth: "1"
    composerBottomGap: roomy
    mascot: deepy
    mascotScope: all
    permissionsControl: true
    statsPosition: footer
    contextDisplay: pie
    contextNumbers: true
    statsFooterAlign: left
    billingCurrency: CNY
    searchStyle: icon
    sidebarLayout: relaxed
    ongoingIndicator: ring
    chatReveal: on
    processRows: flat
  disabled: false
